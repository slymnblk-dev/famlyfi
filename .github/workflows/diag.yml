name: Diagnose desktop build
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Generate app icons
        run: npx --yes @tauri-apps/cli@2 icon icons/icon-512.png -o src-tauri/icons
      - name: Build (report errors as annotations)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set +e
          echo "key length: ${#TAURI_SIGNING_PRIVATE_KEY}, password length: ${#TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
          echo "::warning::key length ${#TAURI_SIGNING_PRIVATE_KEY}, password length ${#TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
          npx --yes @tauri-apps/cli@2 build --bundles nsis > build.log 2>&1
          code=$?
          grep -nE "^error|error\[|Error|failed|panicked|-->" build.log | grep -v "^.*warning" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          tail -15 build.log | while IFS= read -r l; do echo "::warning::$l"; done
          exit $code
