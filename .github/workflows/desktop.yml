name: Windows app

on:
  workflow_dispatch:
    inputs:
      test:
        description: Test build (pre-release, not the official download)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Generate app icons
        run: npx --yes @tauri-apps/cli@2 icon icons/icon-512.png -o src-tauri/icons
      - name: Diagnostic build (errors as annotations)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set +e
          echo "::warning::key length ${#TAURI_SIGNING_PRIVATE_KEY}, password length ${#TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
          npx --yes @tauri-apps/cli@2 build --bundles nsis > build.log 2>&1
          code=$?
          grep -nE "^error|error\[|Error|failed|panicked|-->" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          tail -12 build.log | while IFS= read -r l; do echo "::warning::$l"; done
          exit $code
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@2
          args: --bundles nsis
          includeUpdaterJson: true
          tagName: ${{ inputs.test && 'desktop-test-v__VERSION__' || 'desktop-v__VERSION__' }}
          releaseName: ${{ inputs.test && 'TEST · Famlyfi for Windows v__VERSION__' || 'Famlyfi for Windows v__VERSION__' }}
          releaseBody: ${{ inputs.test && 'Test build, not live yet. Download the -setup.exe below and double-click it to install.' || 'Download the -setup.exe file below and double-click it to install.' }}
          releaseDraft: false
          prerelease: ${{ inputs.test }}
      - uses: actions/upload-artifact@v4
        with:
          name: Famlyfi-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
