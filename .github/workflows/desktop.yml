name: Windows app

on:
  workflow_dispatch:
    inputs:
      test:
        description: Test build (pre-release, not the official download)
        type: boolean
        default: false
      notes:
        description: "What's new (one item per line), shown in the in-app update window"
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Pack the app into the desktop build
        shell: bash
        run: |
          mkdir -p src-tauri/dist
          cp privacy.html manifest.webmanifest src-tauri/dist/
          cp index.html src-tauri/dist/app.html
          cp src-tauri/loader.html src-tauri/dist/index.html
          cp -r icons src-tauri/dist/
          cp src-tauri/splash/index.html src-tauri/dist/splash.html
      - name: Generate app icons
        run: npx --yes @tauri-apps/cli@2 icon icons/icon-512.png -o src-tauri/icons
      - name: Prepare update signing key
        shell: bash
        env:
          K: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          P: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          k="$(printf '%s' "$K" | tr -d '[:space:]')"
          p="$(printf '%s' "$P" | tr -d '[:space:]')"
          echo "::add-mask::$k"
          echo "::add-mask::$p"
          echo "TAURI_SIGNING_PRIVATE_KEY=$k" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$p" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@2
          args: --bundles nsis
          includeUpdaterJson: true
          tagName: ${{ inputs.test && 'desktop-test-v__VERSION__' || 'desktop-v__VERSION__' }}
          releaseName: ${{ inputs.test && 'TEST · Famlyfi for Windows v__VERSION__' || 'Famlyfi for Windows v__VERSION__' }}
          releaseBody: ${{ inputs.notes != '' && inputs.notes || 'Improvements and fixes.' }}
          releaseDraft: false
          prerelease: ${{ inputs.test }}
      - uses: actions/upload-artifact@v4
        with:
          name: Famlyfi-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
