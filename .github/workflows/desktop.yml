name: Windows app

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Generate app icons
        run: npx --yes @tauri-apps/cli@2 icon icons/icon-512.png -o src-tauri/icons
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@2
          args: --bundles nsis
          tagName: desktop-v__VERSION__
          releaseName: Famlyfi for Windows v__VERSION__
          releaseBody: Download the -setup.exe file below and double-click it to install.
          releaseDraft: false
      - uses: actions/upload-artifact@v4
        with:
          name: Famlyfi-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
