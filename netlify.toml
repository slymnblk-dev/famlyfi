[build]
  publish = "."
  # Website goes live ONLY when the commit message contains [website] (saves Netlify credits).
  # Deploy Previews (pull requests / test links) always build, and they are free.
  ignore = "[ \"$CONTEXT\" = \"production\" ] && ! git log -1 --pretty=%B | grep -qF '[website]'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
