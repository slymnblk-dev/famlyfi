[build]
  publish = "."
  # Production only: skip the website deploy (saves Netlify credits) when only desktop-app / repo files changed.
  # Deploy Previews (pull requests) always build, and they are free.
  ignore = "[ \"$CONTEXT\" = \"production\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)src-tauri' ':(exclude).github' ':(exclude)README.md' ':(exclude)netlify.toml' ':(exclude).gitignore'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
