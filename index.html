<style>
/* =========================================================
   1. DESIGN TOKENS
   Layout: sticky sidebar + content on desktop, bottom dock + sheets on phones.
   Dark-first; light values follow the viewer or the in-app theme setting.
   ========================================================= */
:root{
  --bg:#0F1013; --surface:#1A1B20; --surface2:#24252B; --surface3:#2C2D34;
  --line:rgba(255,255,255,.07); --other:#4A4B55; --text:#F3F2EE; --muted:#8C8D96; --ink:#0F1013; --on-accent:#0F1013;
  --accent:#FFB547; --danger:#FF5B47; --scrim:rgba(0,0,0,.6);
  --g-violet:#9C95FF; --g-coral:#FF5B47; --g-mint:#3DDC97; --g-pink:#FF7EB6;
  --g-amber:#FFB547; --g-sky:#5BB8FF; --g-lime:#D2F35C; --g-sand:#E8C39E;
  --font:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-card:24px; --r-pill:999px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F4F0; --surface:#FFFFFF; --surface2:#ECECE7; --surface3:#E2E2DC;
    --line:rgba(0,0,0,.08); --other:#C4C4CA; --text:#121316; --muted:#62636B; --ink:#0F1013; --on-accent:#FFFFFF;
    --accent:#C77700; --danger:#D9432E; --scrim:rgba(20,20,24,.45);
    --g-violet:#6B61F0; --g-coral:#E03A26; --g-mint:#0F9A6C; --g-pink:#D63F86;
    --g-amber:#C77700; --g-sky:#1F7FD1; --g-lime:#6E9A00; --g-sand:#A87B4F;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F4F4F0; --surface:#FFFFFF; --surface2:#ECECE7; --surface3:#E2E2DC;
  --line:rgba(0,0,0,.08); --other:#C4C4CA; --text:#121316; --muted:#62636B; --ink:#0F1013; --on-accent:#FFFFFF;
  --accent:#C77700; --danger:#D9432E; --scrim:rgba(20,20,24,.45);
  --g-violet:#6B61F0; --g-coral:#E03A26; --g-mint:#0F9A6C; --g-pink:#D63F86;
  --g-amber:#C77700; --g-sky:#1F7FD1; --g-lime:#6E9A00; --g-sand:#A87B4F;
  color-scheme:light;
}

/* =========================================================
   2. BASE
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--text)}
a{color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* =========================================================
   3. LAYOUT (app shell)
   ========================================================= */
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding:24px 16px 130px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.mtitle{margin:0;font-size:28px;font-weight:800;letter-spacing:-.045em;line-height:1}
.mtop .brand{font-size:28px;letter-spacing:-.045em;line-height:1}
.mtop .brand i{width:8px;height:8px}
.mtop .right{display:flex;align-items:center;gap:10px}
.gap-hero{margin-top:34px}
@media (max-width:899px){.dt-only{display:none!important}.topbar .btn.primary{display:none}.gap-hero{margin-top:8px}.hero-row{margin-top:10px}.main{padding-bottom:150px}.cards{margin-top:22px}.sec-h{margin-top:34px}.acards{margin-top:24px}}
@media (min-width:900px){.m-only{display:none!important}}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;width:248px;flex:none;
    padding:30px 16px 22px 22px;border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .main{padding:34px 40px 64px}
  .dock,.mtop{display:none!important}
}

/* Sidebar */
.brand{font-size:23px;font-weight:800;letter-spacing:-.04em;text-decoration:none;color:var(--text)}
.brand i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:2px}
.side .brand{margin:0 0 36px 12px}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:12px;font-size:15px;font-weight:500;color:var(--muted);text-align:left;text-decoration:none}
.nav:hover{background:var(--surface);color:var(--text)}
.nav.on{background:var(--surface);color:var(--text)}
.nav .cnt{margin-left:auto;font-size:13px}
.nav .dot{width:10px;height:10px;border-radius:4px;margin:0 4px;flex:none}
.side-lbl{display:flex;justify-content:space-between;align-items:center;margin:26px 8px 4px 12px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.side-lbl button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.side-lbl button:hover{background:var(--surface);color:var(--text)}
.side-lbl .sg-toggle{width:auto;height:28px;padding:0 8px 0 0;margin-left:0;display:flex;align-items:center;gap:6px;font:inherit;color:var(--muted);letter-spacing:inherit}
.side-lbl .sg-toggle:hover{background:none;color:var(--text)}
.sg-wrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s var(--ease),opacity .25s}
.sg-wrap.closed{grid-template-rows:0fr;opacity:0;pointer-events:none}
.side-foot{margin-top:auto;padding-top:18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
.me{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:8px;border-radius:14px;text-decoration:none}
.me:hover,.me.on{background:var(--surface)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;text-decoration:none}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover,.iconbtn.on{background:var(--surface);color:var(--text)}

/* Mobile dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:30px 16px calc(18px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--bg) 62%,transparent);display:flex;gap:10px;pointer-events:none}
.dock>*{pointer-events:auto}
.dock nav{flex:1;height:62px;border-radius:var(--r-pill);background:var(--surface);display:flex;align-items:center;justify-content:space-around;padding:0 6px;max-width:460px;margin-left:auto}
.tab{width:52px;height:48px;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--muted);text-decoration:none}
.tab.on{background:var(--text);color:var(--bg)}
.tab svg.i{width:21px;height:21px}
.fab{width:62px;height:62px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.fab svg.i{width:24px;height:24px;stroke-width:2.6}
.dock .spacer{flex:1;max-width:460px;margin-right:auto;display:none}

/* =========================================================
   4. COMPONENTS
   ========================================================= */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border-radius:var(--r-pill);padding:4px;gap:2px}
.seg button{height:34px;padding:0 15px;border-radius:var(--r-pill);font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.seg button.on{background:var(--text);color:var(--bg)}
.seg.sm{background:var(--surface2);padding:3px}
.seg.sm button{height:32px;padding:0 14px;font-size:13.5px}
.btn{height:48px;padding:0 22px;border-radius:var(--r-pill);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--on-accent);font-weight:800;letter-spacing:-.02em}
.btn.ghost{background:var(--surface2)}
.btn.text{padding:0 14px}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none}
html.desk-boot body{opacity:0}
html.desk-boot.shown body{opacity:1;transition:opacity .6s cubic-bezier(.2,.7,.2,1)}
html.desk-boot.shown .main{animation:deskIn .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes deskIn{from{transform:translateY(8px)}to{transform:none}}
.wn{position:fixed;right:24px;bottom:24px;z-index:60;width:min(340px,calc(100vw - 32px));padding:16px 16px 14px;border-radius:20px;background:var(--surface2);box-shadow:0 22px 50px rgba(0,0,0,.35),inset 0 0 0 1px var(--line);animation:wnIn .45s var(--spring) both}
.wn.out{animation:wnOut .25s ease forwards}
@keyframes wnIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes wnOut{to{opacity:0;transform:translateY(10px)}}
.wn-h{display:flex;align-items:center;gap:10px}.wn-h b{flex:1;font-size:15.5px;font-weight:800;letter-spacing:-.02em}
.wn-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--g-mint) 18%,transparent);color:var(--g-mint)}.wn-ic svg.i{width:15px;height:15px;stroke-width:2.6}
.wn-x{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}.wn-x:hover{background:var(--surface3)}.wn-x svg.i{width:14px;height:14px}
.wn ul{margin:10px 0 0;padding:0 0 0 38px;display:grid;gap:5px;font-size:14px;line-height:1.4;color:var(--text)}
.wn li::marker{color:var(--accent)}
.wn p{margin:8px 0 0 38px;font-size:14px;color:var(--muted)}
.wn-ok{margin:12px 0 0 38px;padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:700;background:var(--surface3)}.wn-ok:hover{filter:brightness(1.15)}
@media (max-width:899px){.wn{right:16px;bottom:110px}}
.up-hero{display:flex;align-items:center;gap:16px;margin-top:14px}
.up-ic{width:56px;height:56px;flex:none;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.up-ic svg.i{width:26px;height:26px}
.up-new{margin-top:22px;padding:16px 18px;border-radius:18px;background:var(--surface2)}
.up-lbl{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.up-new ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:9px}
.up-new li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.up-new li svg.i{width:16px;height:16px;margin-top:2px;color:var(--g-mint);stroke-width:2.6}
.up-bar{position:relative;height:4px;margin-top:22px;border-radius:4px;background:var(--surface2);overflow:hidden}
.up-bar i{position:absolute;inset:0;width:35%;border-radius:4px;background:var(--accent);animation:upSlide 1.1s cubic-bezier(.65,0,.35,1) infinite}
@keyframes upSlide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.up-wait{margin:10px 0 0;font-size:13.5px;color:var(--muted)}
.up-pill{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:10px;padding:10px 14px;border-radius:14px;font-size:13.5px;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent);transition:filter .2s}
.up-pill:hover{filter:brightness(1.12)}
.up-pill i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.side-foot:has(.up-pill){flex-wrap:wrap}
.st-btn.up-cta{background:var(--accent);color:var(--on-accent)}
.si-ic.rs-ic{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.rs-lbl{display:block;margin-top:22px;font-size:13.5px;color:var(--muted)}.rs-lbl b{color:var(--text);letter-spacing:.06em}
.rs-in{margin-top:8px;text-transform:uppercase;letter-spacing:.18em;font-weight:700}
.rs-in::placeholder{letter-spacing:.18em;opacity:.35}
.si-email.rs-in:focus{box-shadow:inset 0 0 0 1.5px var(--danger)}
.btn.danger-text{color:var(--danger);padding:0 6px}
.btn svg.i{width:16px;height:16px;stroke-width:2.6}
.chip{height:40px;padding:0 16px;border-radius:var(--r-pill);background:var(--surface);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.chip:hover{background:var(--surface2)}
.chip.dark{background:var(--text);color:var(--bg);font-weight:600}
.chip svg.i{width:15px;height:15px}

.eyebrow{font-size:15px;color:var(--muted);font-weight:500}
.hero{margin:6px 0 0;font-size:clamp(64px,13vw,132px);line-height:.86;font-weight:800;letter-spacing:-.06em;color:var(--accent);text-wrap:balance}
.hero-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hwrap{}
.hstage{display:grid;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;padding-bottom:.08em}
.hs{grid-area:1/1;will-change:transform,opacity,filter}
.hs .hero{color:var(--hc,var(--accent))}
.hs .eyebrow{margin-bottom:0}
.hs.in{animation:hsIn .85s var(--ease) both}
.hs.out{animation:hsOut .5s cubic-bezier(.5,0,.9,.4) both;pointer-events:none}
@keyframes hsIn{from{opacity:0;transform:translateY(34%) scale(.97);filter:blur(16px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes hsOut{from{opacity:1;transform:none;filter:blur(0)}to{opacity:0;transform:translateY(-34%) scale(.97);filter:blur(16px)}}
.hdots{display:flex;gap:6px;margin-top:22px}
.hdot{height:4px;width:16px;border-radius:4px;background:var(--line);border:0;padding:0;position:relative;overflow:hidden;transition:width .5s var(--ease);cursor:pointer}
.hdot::before{content:'';position:absolute;inset:-10px 0}
.hdot.on{width:40px}
.hdot.on::after{content:'';position:absolute;inset:0;background:var(--text);opacity:.85;transform-origin:left;animation:hdp var(--hdur,5000ms) linear both}
.hwrap:hover .hdot.on::after{animation-play-state:paused}
@keyframes hdp{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.hs.in,.hs.out{animation-duration:.01s}}
.hero-unit{font-size:clamp(17px,2.4vw,22px);font-weight:700;letter-spacing:-.02em}
.hero-unit span{color:var(--muted);font-weight:500}
.title{margin:0;font-size:clamp(56px,10vw,112px);line-height:.86;font-weight:800;letter-spacing:-.06em;color:var(--accent)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px;margin-top:28px}
@media (min-width:900px){.cards{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}}
.sc{background:var(--surface);border-radius:22px;padding:18px 20px 20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.sc-h{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);font-weight:500}
.tint{display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.sc-h .tint{width:30px;height:30px;border-radius:10px}
.sc-h .tint svg.i{width:15px;height:15px;stroke-width:2.4}
.sc-v{font-size:clamp(26px,3.2vw,36px);font-weight:800;letter-spacing:-.045em;line-height:1;overflow-wrap:anywhere}
.sc-s{font-size:12.5px;color:var(--muted);margin-top:8px}

.card{background:var(--surface);border-radius:var(--r-card);padding:24px 26px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:12px}
.card-t{font-size:20px;font-weight:800;letter-spacing:-.03em}
.link{font-size:13.5px;font-weight:600;color:var(--muted);text-decoration:none}
.link:hover{color:var(--text)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px;margin-top:36px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}

.row{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-of-type{border-top:0}
.tile{width:42px;height:42px;border-radius:14px}
.tile svg.i{width:19px;height:19px}
.nm{font-size:16px;font-weight:600;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px}
.amt{margin-left:auto;font-size:16px;font-weight:700;text-align:right;white-space:nowrap}
.pos{color:var(--g-mint)}
.gpin{display:inline-flex;vertical-align:middle;margin-left:8px;color:var(--muted)}
.gpin svg.i{width:14px;height:14px;transform:rotate(30deg)}
.tag{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:6px;background:var(--surface2);font-size:11px;font-weight:600;color:var(--text)}

.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:44px 0 14px}
.sec-h h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.04em}
.sec-h .acts{display:flex;gap:8px;flex-wrap:wrap}
.sec-cnt{margin-left:10px;font-size:15px;font-weight:500;letter-spacing:0;color:var(--muted)}
@media (max-width:640px){.sec-h h2{min-width:0}.sec-cnt{display:block;margin:4px 0 0;font-size:13px}}
.gsmenu{position:relative}.gsmenu .menu{top:52px;right:0}
@media (max-width:899px){.sec-h{flex-wrap:nowrap}}

.bar{display:flex;gap:4px;height:14px;margin-top:12px}
.bar span{border-radius:7px;min-width:6px;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:10px 24px;margin-top:14px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.legend i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.legend b{color:var(--text);font-weight:600}

/* Groups (Overview) */
.groups{display:flex;flex-direction:column;gap:12px}
.gcard{background:var(--surface);border-radius:22px}
.ghead{position:relative;display:flex;align-items:center}
.gtoggle{flex:1;min-width:0;display:flex;align-items:center;gap:16px;padding:18px 8px 18px 22px;text-align:left;border-radius:22px}
.gname{font-size:19px;font-weight:800;letter-spacing:-.03em}
.gname .gn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.gname .gpin{flex:none}
.gcount{flex:none;display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;margin-left:10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:0;line-height:1;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}

.gbody.closing{animation:collapse .18s ease-in forwards}
@keyframes expand{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes collapse{to{opacity:0;transform:translateY(-6px)}}
.removing{animation:remove .28s ease-in forwards}
@keyframes remove{to{opacity:0;transform:scale(.96)}}
.flash{animation:flash 1.8s ease-out;border-radius:12px}
@keyframes flash{0%,35%{background:color-mix(in srgb,var(--accent) 18%,transparent)}100%{background:transparent}}
.node.pop i{animation:nodePop .5s var(--spring)}
@keyframes nodePop{40%{transform:scale(1.4)}}
.menu{animation:pop .2s var(--spring)}
.confirm{animation:rise .28s var(--ease)}
#modal.closing .scrim{animation:fadeOut .2s ease-in forwards}
#modal.closing .dialog{animation:dialogOut .2s ease-in forwards}
@keyframes fadeOut{to{opacity:0}}
@keyframes dialogOut{to{opacity:0;transform:translate(-50%,14px) scale(.97)}}
@keyframes sheetOut{to{transform:translate3d(0,100%,0)}}
@media (max-width:640px){#modal.closing .dialog{animation-name:sheetOut}}
.toast{transition:transform .4s var(--spring),opacity .25s}
/* sliding indicators */
.navs{position:relative;display:flex;flex-direction:column;gap:4px}
.ind{position:absolute;left:0;right:0;top:0;height:44px;border-radius:12px;background:var(--surface);transition:transform .4s var(--spring),height .3s var(--ease),opacity .2s;pointer-events:none}
.ind.instant{transition:none}
.navs .nav{position:relative;z-index:1}
.navs .nav.on,.navs .nav:hover{background:transparent}
.navs .nav:hover:not(.on){color:var(--text)}
.dock nav{position:relative}
.dind{position:absolute;top:7px;left:0;width:52px;height:48px;border-radius:999px;background:var(--text);transition:transform .45s var(--spring);pointer-events:none}
.dind.instant{transition:none}
.dock .tab{position:relative;z-index:1;transition:color .3s,transform .18s var(--ease)}
.dock .tab.on{background:transparent;color:var(--bg)}
.fab{transition:transform .35s var(--spring),opacity .2s,filter .2s}
.fab{transition:transform .35s var(--spring),opacity .2s,filter .2s,width .35s var(--ease),margin .35s var(--ease)}
.fab.hide{transform:scale(.3) rotate(-90deg);opacity:0;pointer-events:none;width:0;margin-left:-10px}
.split{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:24px;margin-top:22px;padding:20px 0}
.split>div{padding:2px 22px}.split>div+div{border-left:1px solid var(--line)}
.split>div>span{display:block;font-size:13.5px;color:var(--muted)}
.split b{display:block;margin-top:8px;font-size:30px;font-weight:800;letter-spacing:-.05em;line-height:1}
.mcards{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.mcards .sc{gap:20px}
.mcards .sc-v{font-size:38px}
.mcards .prog{margin-top:16px}
.mseg{display:flex;gap:3px;height:8px;margin-top:16px}
.mseg span{border-radius:8px;background:var(--c);min-width:6px}
.slims{display:flex;flex-direction:column;margin-top:14px}
.slim{display:flex;align-items:center;gap:10px;padding:18px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--text)}
.slim>span{flex:1;font-size:15px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slim b{font-size:20px;font-weight:800;letter-spacing:-.04em}
.slim svg.i{width:16px;height:16px;color:var(--muted)}
@media (max-width:899px){.gcard .ghead .sub{display:none}}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:var(--r-card,24px);margin-top:28px;padding:20px 0}
.pstats>div{text-align:center;padding:2px 8px}.pstats>div+div{border-left:1px solid var(--line)}
.pstats b{display:block;font-size:34px;font-weight:800;letter-spacing:-.05em;line-height:1}
.pstats span{display:block;margin-top:8px;font-size:13.5px;color:var(--muted)}
/* Item sheet */
.im .bigname{margin-top:22px}
.im-to{display:inline-flex;align-items:center;gap:7px}
.im-to i{width:9px;height:9px;border-radius:3px;background:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--ink) 20%,transparent)}
.im-in{margin-top:22px;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:var(--muted)}
.im-in span{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--text);font-weight:600}
.im-in i{width:8px;height:8px;border-radius:3px;background:var(--c)}
.im-note{margin-top:26px!important}
/* Drag & drop */
.gbody .row[data-act=edit-item]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (hover:hover){.gbody .row[data-act=edit-item]{cursor:grab}}
.gbody .row.dragging{opacity:.3}
.drag-ghost{position:fixed;left:0;top:0;z-index:70;pointer-events:none;display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:16px;background:var(--surface3);box-shadow:0 24px 50px rgba(0,0,0,.45);transform-origin:center;animation:lift .2s var(--spring) both}
.drag-ghost .pen{display:none}
.drag-ghost .amt{margin-left:auto}
@keyframes lift{from{scale:1}to{scale:1.04;rotate:-1.5deg}}
body.is-dragging,body.is-dragging *{cursor:grabbing!important}
.gcard{transition:box-shadow .2s,background-color .2s,transform .2s var(--ease)}
body.is-dragging .gcard.drop-on{box-shadow:inset 0 0 0 2px var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));transform:scale(1.01)}
body.is-dragging .gbody .row:hover .nm{color:inherit}
body.is-dragging .gbody .row:hover .pen{opacity:0}
.gcard{scroll-margin-top:28px}
.gcard.pulse{animation:gpulse 1.4s var(--ease)}
@keyframes gpulse{0%,30%{box-shadow:inset 0 0 0 2px var(--c);background:color-mix(in srgb,var(--c) 9%,var(--surface))}100%{box-shadow:inset 0 0 0 2px transparent}}
#side-groups .nav.on{color:var(--text);background:var(--surface)}
.drop-line{position:relative;height:0;z-index:2;pointer-events:none}
.drop-line::before{content:"";position:absolute;left:-6px;right:0;top:-1.5px;height:3px;border-radius:3px;background:var(--c,var(--accent));box-shadow:0 0 12px color-mix(in srgb,var(--c,var(--accent)) 60%,transparent)}
.drop-line::after{content:"";position:absolute;left:-10px;top:-5px;width:11px;height:11px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 3px var(--c,var(--accent))}
.drag-tip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:-4px 0 14px}
.drag-tip button{margin-left:auto;white-space:nowrap;font-size:12.5px;font-weight:600;color:var(--muted)}
.drag-tip button:hover{color:var(--text)}
.im .cur.pos{color:var(--g-mint)}
.im-freq{display:flex;align-items:center;gap:12px;margin:14px 0 2px;flex-wrap:wrap}
.im-acts{position:relative;display:flex;gap:8px}
.im-menu{top:46px;right:0;min-width:230px}
.im-switch{width:34px;height:20px;border-radius:999px;background:var(--surface3);position:relative;flex:none;transition:background .2s}
.im-switch i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .25s var(--spring),background .2s}
.im-switch.on{background:var(--accent)}.im-switch.on i{transform:translateX(14px);background:var(--on-accent)}
.im-yr{height:28px;padding:0 11px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.im-yr svg.i{width:13px;height:13px}
.im-note{margin-top:22px;border-top:1px solid var(--line)}
.im-note-h{display:flex;align-items:center;gap:10px;width:100%;padding:16px 2px 4px;text-align:left;color:var(--muted);font-size:14px;font-weight:600}
.im-note-h:hover{color:var(--text)}
.im-note-h svg.i{width:15px;height:15px}
.im-note-h span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.im-note-h em{font-style:normal;font-weight:500;font-size:12.5px;opacity:.7}
.im-note.open .chev{transform:rotate(180deg)}
.im-note textarea{display:block;width:100%;margin-top:10px;padding:14px 16px;border:0;outline:none;border-radius:16px;background:var(--surface2);font:inherit;font-size:15px;line-height:1.45;resize:none;animation:expand .28s var(--ease)}
.im-note textarea::placeholder{color:var(--muted)}
.item-note{display:block;max-width:44ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.im-fq{height:34px;padding:0 6px 0 12px;border-radius:var(--r-pill);background:var(--surface2);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.im-fq svg.i{width:14px;height:14px;color:var(--muted)}
.im-fq.on{box-shadow:inset 0 0 0 1.5px var(--accent)}
.im-sw{height:24px;padding:0 9px;border-radius:var(--r-pill);background:var(--surface3);color:var(--muted);font-size:12px;display:inline-flex;align-items:center;margin-left:2px}
.im-fq:hover .im-sw{color:var(--text)}
.im-hint{font-size:13.5px;color:var(--muted)}
.im .flbl{margin-top:26px}
.amtrow{cursor:text}
.bigamt{flex:none;max-width:calc(100% - 70px)}
.im-groups{display:flex;flex-wrap:wrap;gap:8px}
.im-glbl{display:flex;align-items:center;justify-content:space-between;margin-top:26px;margin-bottom:10px}
.im .im-glbl .flbl{margin:0}
.im-all{height:30px;padding:0 12px;border-radius:var(--r-pill);background:var(--surface2);font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.im-all:hover{color:var(--text)}
.im-all svg.i{width:13px;height:13px}
.im-groups.scroll{--px:30px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--px));padding:2px var(--px);scroll-padding:0 var(--px)}
.im-groups.scroll::-webkit-scrollbar{display:none}
.im-groups.scroll .gchip{flex:none}
.im-groups.scroll.fr{-webkit-mask-image:linear-gradient(to right,#000 85%,transparent);mask-image:linear-gradient(to right,#000 85%,transparent)}
.im-groups.scroll.fl{-webkit-mask-image:linear-gradient(to right,transparent,#000 15%);mask-image:linear-gradient(to right,transparent,#000 15%)}
.im-groups.scroll.fl.fr{-webkit-mask-image:linear-gradient(to right,transparent,#000 15%,#000 85%,transparent);mask-image:linear-gradient(to right,transparent,#000 15%,#000 85%,transparent)}
@media (max-width:640px){.im-groups.scroll{--px:20px}}
.gchip{height:40px;padding:0 15px;border-radius:var(--r-pill);background:var(--surface2);display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted);transition:background-color .2s,color .2s,box-shadow .2s,transform .18s var(--ease)}
.gchip:hover{color:var(--text)}
.gchip:active{transform:scale(.95)}
.gchip i{width:10px;height:10px;border-radius:4px;background:var(--c)}
.gchip.on{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--c)}
.gchip.new{background:transparent;box-shadow:inset 0 0 0 1.5px var(--surface3)}
.gchip.new svg.i{width:14px;height:14px}
.im-foot{display:flex;gap:10px;margin-top:28px}
.im-foot .btn.primary{flex:1;height:56px;font-size:16px}
.im-del{width:56px;height:56px;border-radius:50%;background:var(--surface2);color:var(--danger);display:grid;place-items:center;flex:none;transition:transform .18s var(--ease),background-color .2s}
.im-del:hover{background:color-mix(in srgb,var(--danger) 14%,var(--surface2))}
.im-del:active{transform:scale(.94)}
/* Spending breakdown */
.spend{background:var(--surface);border-radius:var(--r-card)}
.sp-head{display:flex;align-items:center;gap:16px;width:100%;padding:18px 22px;text-align:left;border-radius:var(--r-card)}
.sp-ttl{display:flex;flex-direction:column;gap:3px;flex:none}
.sp-ttl>span{font-size:18px;font-weight:800;letter-spacing:-.03em}

.sp-mini{flex:1;display:flex;gap:3px;height:8px;max-width:260px;margin-left:auto}

.spend.open .chev{transform:rotate(180deg)}
.sp-body{padding:0 22px 20px;animation:expand .32s var(--ease)}

.sp-more:hover{color:var(--text)}
.sp-ring{position:relative;width:100%;max-width:240px;aspect-ratio:1;margin:0 auto}

.sp-arc{fill:none;stroke:var(--c);stroke-width:24;cursor:pointer;transition:opacity .25s,stroke-width .25s var(--spring);animation:arcIn .9s var(--ease) both;animation-delay:calc(var(--i) * 60ms)}
.sp-arc:hover,.sp-arc.sel{stroke-width:30}
.sp-arc.dim,.sp-key.dim{opacity:.28}
@keyframes arcIn{from{stroke-dasharray:0 var(--C)}}
.sp-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 50px}

.home-charts{align-items:stretch}

mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}

const curYM = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}`; };

const Calc = {

  amountAt: (it, ym) => { if (!it.ch || !it.ch.length) return it.amount; let a = it.ch[0].a; it.ch.forEach(c => { if (!c.from || c.from <= ym) a = c.a; }); return a; },
  // An entry counts from its start month, or else from the month it was added (since); never before
  activeAt: (it, ym) => { const st = it.start || it.since; return (!st || st <= ym) && (!it.end || it.end >= ym); },
  monthly: (it, ym = curYM()) => Calc.activeAt(it, ym) ? (it.freq === 'yearly' ? Calc.amountAt(it, ym) / 12 : Calc.amountAt(it, ym)) * (it.type === 'income' ? 1 : -1) : 0,
  factor: () => (db.settings.period === 'year' ? 12 : 1),
  itemsOf: gid => db.items.filter(i => i.groupId === gid),
  groupNet: gid => Calc.itemsOf(gid).reduce((s, i) => s + Calc.monthly(i), 0),
  groupOut: gid => Calc.itemsOf(gid).reduce((s, i) => s + Math.min(0, Calc.monthly(i)), 0),
  isSavings: gid => !!db.groups.find(g => g.id === gid)?.savings,
  // out = real spending; save = money put aside (savings categories). Left over = income − spending − savings.

    let inn = 0, out = 0, save = 0, yearly = 0, nIn = 0, nOut = 0, nSave = 0;
    const sav = new Set(db.groups.filter(g => g.savings).map(g => g.id));
    db.items.forEach(i => {

      cells += `<button class="${iso === v ? 'on' : ''} ${iso === todayISO() ? 'now' : ''}" data-act="dp-pick" data-k="${o.key}" data-v="${iso}" ${dis ? 'disabled' : ''}>${dd}</button>`; }
    const nextDis = o.max && ymOf(vy, vm) >= o.max.slice(0, 7);
    body = `<div class="dp-head"><button class="dp-nav" data-act="dp-nav" data-k="${o.key}" data-v="-1" aria-label="Previous month">${icon(UI.back)}</button><b>${MONTHS[vm]} ${vy}</b><button class="dp-nav" data-act="dp-nav" data-k="${o.key}" data-v="1" aria-label="Next month" ${nextDis ? 'disabled' : ''}>${icon(UI.back, 'flip')}</button></div>
      <div class="dp-week">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(x => `<span>${x}</span>`).join('')}</div><div class="dp-days">${cells}</div>`;
  }
  const quick = o.kind === 'date'
    ? `<button data-act="dp-pick" data-k="${o.key}" data-v="${todayISO()}">Today</button><button data-act="dp-pick" data-k="${o.key}" data-v="${(() => { const t = new Date(); const e = new Date(t.getFullYear(), t.getMonth(), 0); return `${ymOf(e.getFullYear(), e.getMonth())}-${String(e.getDate()).padStart(2, '0')}`; })()}">End of last month</button>`
    : `<button data-act="dp-pick" data-k="${o.key}" data-v="${curYM()}" ${o.min && curYM() < o.min ? 'disabled' : ''}>This month</button>`;
  return field + `<div class="dp-pop">${body}<div class="dp-foot">${quick}${o.clearable !== false && v ? `<button class="dp-clear" data-act="dp-clear" data-k="${o.key}">Clear</button>` : ''}</div></div>`;
}

/* Breakdown card (Budget + Accounts): collapsible, Chart or Ranking view.
   segs: [{ name, v (abs value), shown (display value), c (color), icon, act, id }] */
function breakdownCard(key, o) {
  const st = (db.bd || (db.bd = {}))[key] || {}, open = o.compact || st.open !== false, view = o.compact ? 'donut' : st.view === 'list' ? 'list' : 'donut';
  // Distinct colours: keep each item's own colour unless an earlier (bigger) one already uses it
  const PAL = ['var(--g-sky)', 'var(--g-mint)', 'var(--g-violet)', 'var(--g-pink)', 'var(--g-lime)', 'var(--g-coral)', 'var(--g-sand)', 'var(--accent)'];
  const all = [...o.segs].sort((a, b) => (!!a.keep - !!b.keep) || b.v - a.v), used = new Set();
  const colored = all.map(x => {
    if (x.keep) return x;
    let c = x.c;
    if (used.has(c)) c = PAL.find(p => !used.has(p)) || c;
    used.add(c); return { ...x, c };
  });
  // Chart shows the 5 biggest; the rest are merged into one calm "Other" slice
  const TOP = 5, main = colored.filter(x => !x.keep), kept = colored.filter(x => x.keep);
  let segs = colored, extra = 0;
  if (main.length > TOP + 1) {
    const rest = main.slice(TOP), v = rest.reduce((n, x) => n + x.v, 0);
    extra = rest.length;
    segs = [...main.slice(0, TOP), { name: `Other (${rest.length})`, v, shown: o.fmtV ? o.fmtV(v) : fmt(v), c: 'var(--other)', other: true }, ...kept];
  }
  const sum = segs.reduce((n, x) => n + x.v, 0) || 1, pct = v => Math.round(v / sum * 100);
  ui.bdData = ui.bdData || {}; ui.bdData[key] = { segs, sum, center: o.center };
  const head = o.compact ? `<div class="sp-head"><span class="sp-ttl"><span>${o.title}</span><small class="num">${o.sub}</small></span><a class="link sp-all" href="${o.href}">See all${icon(UI.right)}</a></div>` : `<button class="sp-head" data-act="bd-toggle" data-k="${key}" aria-expanded="${open}">
      <span class="sp-ttl"><span>${o.title}</span><small class="num">${o.sub}</small></span>
      ${open ? '' : `<span class="sp-mini">${segs.map(x => `<span style="flex:${x.v};--c:${x.c}"></span>`).join('')}</span>`}
      ${icon(UI.chev, 'chev')}</button>`;
  if (!open) return `<section class="spend" style="margin-top:${o.mt || 22}px">${head}</section>`;
  let body;
  if (view === 'donut') {
    const R = 70, C = 2 * Math.PI * R, gap = segs.length > 1 ? 3 : 0;
    let at = 0;
    const arcs = segs.map((x, i) => {
      const len = x.v / sum * C, dl = Math.max(.01, len - gap);
      const el = `<circle class="sp-arc" data-act="bd-sel" data-k="${key}" data-i="${i}" r="${R}" cx="90" cy="90" style="--c:${x.c};--C:${C};--i:${i}" stroke-dasharray="${dl} ${C}" stroke-dashoffset="${-at}"><title>${esc(x.name)}</title></circle>`;
      at += len; return el;
    }).join('');
    body = `<div class="sp-donut" id="bd-${key}">
      <div class="sp-ring"><svg viewBox="0 0 180 180" role="img" aria-label="${o.title}">${arcs}</svg>
        <div class="sp-center">${o.center}</div></div>
      <div class="sp-keys">${segs.map((x, i) => `<button class="sp-key" data-act="bd-sel" data-k="${key}" data-i="${i}" style="--c:${x.c}">
          <i></i><span>${esc(x.name)}</span><b class="num">${x.shown}</b><em class="num">${pct(x.v)}%</em></button>`).join('')}
        ${extra && !o.compact ? `<button class="sp-more" data-act="bd-view" data-k="${key}" data-v="list">See all ${colored.length}${icon(UI.right)}</button>` : ''}</div></div>`;
  } else {
    const max = Math.max(...colored.map(x => x.v)) || 1;
    body = `<div class="sp-list">${[...colored].sort((a, b) => b.v - a.v).map((x, i) => `<button class="sp-li" data-act="${x.act}" data-id="${x.id}" style="--c:${x.c};--i:${i}">

function bdSelect(key, i) {
  const box = $('#bd-' + key), data = ui.bdData?.[key];

  const sel = box.dataset.sel === String(i) ? null : i;
  box.dataset.sel = sel ?? '';
  box.querySelectorAll('.sp-arc,.sp-key').forEach(el => {
    el.classList.toggle('dim', sel != null && el.dataset.i !== String(sel));
    el.classList.toggle('sel', sel != null && el.dataset.i === String(sel));

  const c = box.querySelector('.sp-center');
  if (sel == null) c.innerHTML = data.center;

}
function monthName(ym) {
  const [y, m] = String(ym).split('-').map(Number);

}

// ---- "What's new" note, shown once after the app updates (newest first; keep each line short) ----
const WHATS_NEW = {

  '0.76': ['New profile emojis: heart, rainbow and puppy'],
  '0.75': ['A softer, warmer start-up sound and a slightly quicker splash'],
  '0.74': ['A calm opening chime and a smoother start-up'],
  '0.73': ['A short "What\'s new" note after each update, like this one'],
  '0.72': ['Goal % now sits where your progress ends', 'Cleaner goal editor: currency and account under ⋯'],
  '0.71': ['Goals can have their own currency', 'Choose your own milestone steps and starting amount']

const WhatsNew = {

  run() {
    let seen = null; try { seen = localStorage.getItem(this.KEY); localStorage.setItem(this.KEY, APP_VERSION); } catch (e) { return; }

    const newer = (a, b) => { a = a.split('.').map(Number); b = b.split('.').map(Number); return a[0] !== b[0] ? a[0] > b[0] : (a[1] || 0) > (b[1] || 0); };
