<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Famlyfi</title>
<style>html,body{margin:0;height:100%;background:#0F1013}@media (prefers-color-scheme: light){html,body{background:#F4F4F0}}</style></head>
<body>
<script>
/* Famlyfi desktop loader
   1. Fetch the newest app from GitHub Pages (free, updates ~1 min after "go live").
   2. Otherwise use the last copy saved on this computer.
   3. Otherwise use the copy built into the app (works fully offline).
   Only the real app (it contains APP_VERSION) is ever accepted. */
(async function () {
  window.__famlyfiLoader = 1;
  /* Newest app comes straight from the GitHub project (no publishing queue):
     1. ask GitHub for the latest version id of the "gh-pages" branch,
     2. download that exact version (never stale),
     3. fall back to GitHub Pages, then the last saved copy, then the built-in copy. */
  var REPO = 'slymnblk-dev/famlyfi', PAGES = 'https://slymnblk-dev.github.io/famlyfi/index.html', KEY = 'famlyfi.appcache';
  function ver(h) { var m = h && h.match(/const APP_VERSION = '([\d.]+)'/); return m ? m[1] : null; }
  function newer(a, b) { a = String(a).split('.').map(Number); b = String(b).split('.').map(Number); for (var i = 0; i < Math.max(a.length, b.length); i++) { if ((a[i] || 0) !== (b[i] || 0)) return (a[i] || 0) > (b[i] || 0); } return false; }
  function get(url, opts, ms) {
    var ctl = new AbortController(), t = setTimeout(function () { ctl.abort(); }, ms || 3000);
    opts = opts || {}; opts.signal = ctl.signal; opts.cache = 'no-store';
    return fetch(url, opts).then(function (r) { clearTimeout(t); if (!r.ok) throw new Error(r.status); return r.text(); });
  }
  async function fromRepo() {
    var sha = (await get('https://api.github.com/repos/' + REPO + '/commits/gh-pages', { headers: { Accept: 'application/vnd.github.sha' } }, 2500)).trim();
    if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('no sha');
    return get('https://raw.githubusercontent.com/' + REPO + '/' + sha + '/index.html', null, 3500);
  }
  var found = await Promise.all([
    fromRepo().catch(function () { return null; }),
    get(PAGES + '?t=' + Date.now(), null, 3500).catch(function () { return null; })
  ]);
  var cached = null; try { cached = localStorage.getItem(KEY); } catch (e) {}
  var bundled = null; try { bundled = await (await fetch('app.html')).text(); } catch (e) {}
  // Pick the newest real app among everything we have.
  var html = null;
  [found[0], found[1], cached, bundled].forEach(function (h) { if (ver(h) && (!html || newer(ver(h), ver(html)))) html = h; });
  if (html && html !== cached) { try { localStorage.setItem(KEY, html); } catch (e) {} }
  document.open(); document.write(html || '<p style="font-family:sans-serif;padding:40px">Famlyfi could not start. Please reopen the app.</p>'); document.close();
})();
</script>
</body></html>
